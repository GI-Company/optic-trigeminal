<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="OpticTrigeminal v3.0.0 - Healthcare AI System">
    <title>OpticTrigeminal | Clinical Dashboard</title>
</head>
<body>
    <div id="app" class="min-h-screen bg-slate-900 text-slate-100">
        <!-- Loading skeleton -->
        <div class="flex items-center justify-center h-screen">
            <div class="text-center">
                <div class="text-4xl font-bold mb-4 text-cyan-400">OpticTrigeminal</div>
                <div class="text-slate-400">Initializing clinical interface...</div>
                <div class="mt-8 flex justify-center">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-cyan-400"></div>
                </div>
            </div>
        </div>
    </div>
    <!--
      Toast host for showToast() (web/src/utils/ui-helpers.ts). It looks up
      #system-log by id; that element used to only exist in the old,
      unused web/src/main.ts entry point, not here -- so every single
      showToast() call in the actually-running app (main-refactored.ts)
      silently did nothing, success and error alike. Lives outside #app so
      it survives screen navigation, which replaces #app's innerHTML wholesale.
    -->
    <div id="system-log" class="fixed bottom-4 right-4 z-50 flex max-h-80 w-80 flex-col-reverse gap-1.5 overflow-y-auto"></div>
    <!-- Host for Modal.ts (admit/discharge/assign-patient, alert override).
         Lives outside #app for the same reason #system-log does: it must
         survive #app's innerHTML being replaced wholesale on navigation. -->
    <div id="modal-root"></div>
    <script type="module" src="/src/main-refactored.ts"></script>
</body>
</html>
